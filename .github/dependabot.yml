# What keeps the pinned actions current: a pin nobody moves rots, and trades a live risk for a stale one. Dependabot
# opens one reviewed pull request a week, with the release notes; nothing merges it automatically. A release becomes
# old enough to take after three days, as every other pin here. The Gradle Wrapper and gradle/libs.versions.toml are
# moved by hand, with gradle/verification-metadata.xml renewed in the same commit, as AGENTS.md says.
version: 2
updates:
    # Every action is pinned to a commit with its version beside it, in the workflows and the composite actions.
    - package-ecosystem: github-actions
      directories:
          - "/"
          - "/.github/actions/*"
      schedule:
          interval: weekly
      cooldown:
          default-days: 3
      groups:
          actions:
              patterns: ["*"]
      commit-message:
          prefix: "Move the pinned workflow steps"

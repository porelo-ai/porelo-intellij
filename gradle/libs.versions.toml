# Every version the build names, in one place Dependabot reads. The test libraries, Error Prone and NullAway are
# the ones porelo-parent pins for the Maven repositories.
[versions]
intellij-platform = "2.19.0"
logchange = "1.20.0"
plugin-verifier = "1.410"
porelo-buildtools = "0.5.1-SNAPSHOT"
junit = "6.1.3"
porelo-wire = "0.5.0"
jspecify = "1.0.1"
errorprone-plugin = "5.1.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
assertj = "3.27.7"
spotless = "8.10.4"
# 1.37.0 is not taken: run through Spotless, it fails on every file, while 1.36.0 formats; porelo-parent pins the same.
google-java-format = "1.36.0"

[libraries]
porelo-release = { module = "org.fuin.porelo:porelo-release", version.ref = "porelo-buildtools" }
porelo-machines = { module = "org.fuin.porelo:porelo-machines", version.ref = "porelo-buildtools" }
porelo-wire = { module = "org.fuin.porelo:porelo-wire", version.ref = "porelo-wire" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
logchange = { id = "dev.logchange", version.ref = "logchange" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

title: A tool window "Sokar" lists the projects and repositories where something waits at the gates of the machines the interface knows, or groups them under each machine, says which machines do not answer, and notifies when something new waits; a push opens as a review in IntelliJ's own diff, read from a bare cache of the plugin's own against where it and its branch last met, the far-reaching files first, with Approve onto sokar/<task> or a branch the person names and Reject with a reason that reaches the task
type: added

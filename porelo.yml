# What this repository's whole local build needs: the image a Porelo task on this repository is built from,
# for `./gradlew build verifyPlugin documents`, as the Build and the Shared rules check run them.
# A draft: no Porelo reads this file yet. Tools only, never a rule.
#
# The pins are those the Build takes: the Ubuntu image and the GraalVM from porelo-machines' own pins
# (machines.properties), which the Build installs with `machines jdk`. A move there is not followed here by itself.
# Gradle itself, the IntelliJ IDEAs the plugin is built and verified against and every library come at build time,
# through the Gradle Wrapper and gradle/verification-metadata.xml, not from the image.
image:
    base_image: "docker.io/library/ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac"
    snippet: |
        # From Ubuntu: curl for the GraalVM below, git for the test that reads the tracked files.
        RUN apt-get update \
            && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git \
            && rm -rf /var/lib/apt/lists/*
        RUN curl -fsSL -o /tmp/graalvm.tar.gz \
                https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.4.4.1.1/graalvm-community-jdk-25i4-25.0.4.1.1_linux-x64_bin.tar.gz \
            && echo "05ccbbe783210b6886ff7b08fcd0b061c5dce4852b05db87284fc0e24abb08e2  /tmp/graalvm.tar.gz" | sha256sum -c - \
            && mkdir -p /opt/graalvm && tar -xzf /tmp/graalvm.tar.gz -C /opt/graalvm --strip-components=1 \
            && rm /tmp/graalvm.tar.gz \
            && for tool in java javac jar; do ln -s /opt/graalvm/bin/$tool /usr/local/bin/$tool; done
    env:
        JAVA_HOME: /opt/graalvm
        GRAALVM_HOME: /opt/graalvm

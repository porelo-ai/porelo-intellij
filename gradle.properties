# The plugin's coordinates, on the version line of the other Porelo repositories.
pluginGroup = org.fuin.porelo
pluginVersion = 0.5.0-SNAPSHOT

# The IntelliJ IDEA the plugin compiles against is the oldest it supports; the verifier also checks the newest.
platformVersion = 2026.1
pluginSinceBuild = 261
verifyIdeVersions = 2026.1.5,2026.2.3

# A JDK is never downloaded by the build: the pinned GraalVM is JAVA_HOME, locally and in CI.
org.gradle.java.installations.auto-download = false
org.gradle.java.installations.auto-detect = false
org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC
